name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Staging Deploy ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      # ── Choose ONE of these deploy options and uncomment it ─────────────────
      
      # Option A: Railway (recommended)
      # - name: Deploy to Railway
      #   run: |
      #     npm install -g @railway/cli
      #     railway up --service mailnexa-backend
      #   env:
